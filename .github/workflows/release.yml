# Publishes a release of the branch it is run on, by hand.
#
# Actions › Release › Run workflow, and pick the branch (v1.x or v2.x). The version is that
# branch's "Version:" line in layout/DEBIAN/control. The package is built and released as
# v<version> with the .deb attached as SwitzachWidgetProbe.deb, unless that release already
# exists. The release is marked latest only when its version is the highest released, so
# releases/latest/download/SwitzachWidgetProbe.deb always gets the newest version.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to find the commit that set the version

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^Version: //p' layout/DEBIAN/control)
          [ -n "$version" ] || { echo "No Version: line in layout/DEBIAN/control" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install clang and lld
        if: steps.version.outputs.new == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld

      - name: Get the iOS SDK (theos/sdks, iPhoneOS16.5.sdk only)
        if: steps.version.outputs.new == 'true'
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: SDK="$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" ./build.sh

      - name: Release
        if: steps.version.outputs.new == 'true'
        run: |
          version='${{ steps.version.outputs.version }}'
          # Notes: the message of the commit that set this version, without its title and
          # trailer lines.
          commit=$(git log -1 --format=%H -G '^Version:' -- layout/DEBIAN/control)
          git log -1 --format=%b "$commit" | grep -v -E '^(Co-Authored-By|Signed-off-by):' > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "SwitzachWidgetProbe $version" > "$RUNNER_TEMP/notes.md"
          # One file under a fixed name, so that
          # releases/latest/download/SwitzachWidgetProbe.deb always gets the newest one.
          # (The version is in the package itself and in the release's title.)
          mv build/*.deb "$RUNNER_TEMP/SwitzachWidgetProbe.deb"
          # Latest only if no higher version was released (a v1.x release after a v2.x one is not).
          highest=$( (gh release list --limit 200 --json tagName --jq '.[].tagName' | sed 's/^v//'; echo "$version") | sort -V | tail -1)
          latest=false
          [ "$highest" = "$version" ] && latest=true
          gh release create "v$version" "$RUNNER_TEMP/SwitzachWidgetProbe.deb" \
            --latest="$latest" \
            --target "$GITHUB_SHA" \
            --title "SwitzachWidgetProbe $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
